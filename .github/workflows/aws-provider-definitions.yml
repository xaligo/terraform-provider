name: AWS Provider definitions

on:
  schedule:
    - cron: "17 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check generated inventory and upstream release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check generated definitions
        run: go run ./tools/awsdefinitions generate -check

      - name: Check latest AWS Provider release
        run: go run ./tools/awsdefinitions check-latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
