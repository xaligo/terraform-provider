name: Release Terraform provider

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: terraform-provider-release
  cancel-in-progress: false

jobs:
  goreleaser:
    name: Build, sign, and publish provider release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test provider
        run: go test ./...

      - name: Select next provider version
        id: version
        shell: bash
        run: |
          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          if [[ -z "${latest_tag}" ]]; then
            next_tag="v0.1.0"
          elif [[ "${latest_tag}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            next_tag="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
          else
            echo "::error::Latest provider tag is not strict SemVer: ${latest_tag}"
            exit 1
          fi
          echo "tag=${next_tag}" >> "${GITHUB_OUTPUT}"
          echo "Provider release version: ${next_tag}"

      - name: Import GPG signing key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Create release tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "${RELEASE_TAG}" --message "Release ${RELEASE_TAG}"
          git push origin "refs/tags/${RELEASE_TAG}"

      - name: Prepare GPG passphrase file
        shell: bash
        env:
          RELEASE_GPG_PASSPHRASE: ${{ secrets.PASSPHRASE }}
        run: |
          umask 077
          passphrase_file="${RUNNER_TEMP}/xaligo-gpg-passphrase"
          printf '%s' "${RELEASE_GPG_PASSPHRASE}" > "${passphrase_file}"
          echo "GPG_PASSPHRASE_FILE=${passphrase_file}" >> "${GITHUB_ENV}"

      - name: Build and publish GitHub release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}

      - name: Remove GPG passphrase file
        if: ${{ always() }}
        shell: bash
        run: rm -f "${GPG_PASSPHRASE_FILE}"
